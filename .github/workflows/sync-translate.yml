name: sync-translate
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只同步与构建,不调用 AI(配好 Secret 前验证用)'
        type: boolean
        default: false
      limit:
        description: '只翻译前 N 条(0=全部;小规模试译用)'
        type: number
        default: 0

concurrency:
  group: sync-translate

permissions:
  contents: write

jobs:
  sync-translate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest scripts/test -q

      - name: Sync official database
        run: python scripts/sync.py

      - name: Translate with AI
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/translate.py --concurrency 1000 --limit ${{ inputs.limit }} ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Build artifacts
        run: python scripts/build.py

      - name: Commit translation cache back to main
        run: |
          git config user.name "ow-mod-db bot"
          git config user.email "ow-mod-db-bot@users.noreply.github.com"
          git add source/translations.json source/pending.json source/official.json
          git diff --cached --quiet || git commit -m "chore: 更新翻译缓存 [skip ci]"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
