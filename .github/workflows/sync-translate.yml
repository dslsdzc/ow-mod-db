name: sync-translate
on:
  # 每 30 分钟轮询上游官方数据库;无变化时提前退出(见 Upstream change check)
  schedule:
    - cron: '0,30 * * * *'
  # 术语表/人工翻译/脚本改动推送后自动全流程(缓存提交用 [skip ci] 避免自触发)
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只同步与构建,不调用 AI(配好 Secret 前验证用)'
        type: boolean
        default: false
      limit:
        description: '只翻译前 N 条(0=全部;小规模试译用)'
        type: number
        default: 0

concurrency:
  group: sync-translate

permissions:
  contents: write

jobs:
  sync-translate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest scripts/test -q

      - name: Sync official database
        run: python scripts/sync.py

      # 定时轮询专用: 官方库与快照一致且待翻译清单无变化 → 提前退出,不部署
      - name: Upstream change check
        id: check
        if: github.event_name == 'schedule'
        run: |
          git diff --exit-code --quiet -- source/official.json source/pending.json \
            && echo "skip=true" >> "$GITHUB_OUTPUT" \
            || echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Translate with AI
        if: steps.check.outputs.skip != 'true'
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        # DeepSeek 并发上限按余额动态给(余额低时档位很低),8 为低余额安全值
        run: python scripts/translate.py --concurrency 8 --batch 30 --limit ${{ inputs.limit }} ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Build artifacts
        if: steps.check.outputs.skip != 'true'
        run: python scripts/build.py

      - name: Commit translation cache back to main
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "ow-mod-db bot"
          git config user.email "ow-mod-db-bot@users.noreply.github.com"
          git add source/translations.json source/pending.json source/official.json
          git diff --cached --quiet || git commit -m "chore: 更新翻译缓存 [skip ci]"
          git push

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
