name: sync-translate
on:
  # 每 30 分钟轮询上游官方数据库;无变化时提前退出(见 Upstream change check)
  schedule:
    - cron: '0,30 * * * *'
  # 术语表/人工翻译/脚本改动推送后自动全流程(缓存提交用 [skip ci] 避免自触发)
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只同步与构建,不调用 AI(配好 Secret 前验证用)'
        type: boolean
        default: false
      limit:
        description: '只翻译前 N 条(0=全部;小规模试译用)'
        type: number
        default: 0
      concurrency:
        description: '并发批次数(1=最稳;余额档位允许再调高)'
        type: number
        default: 1
      batch:
        description: '每请求合并条数(1=逐条)'
        type: number
        default: 30
      readme_limit:
        description: '本次最多翻译的 README 数(0=全部;分批上线用)'
        type: number
        default: 0

concurrency:
  group: sync-translate

permissions:
  contents: write

jobs:
  sync-translate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest scripts/test -q

      - name: Sync official database
        run: python scripts/sync.py

      # 定时轮询专用: 官方库与快照一致且待翻译清单无变化 → 提前退出,不部署
      - name: Upstream change check
        id: check
        if: github.event_name == 'schedule'
        run: |
          git diff --exit-code --quiet -- source/official.json source/pending.json \
            && echo "skip=true" >> "$GITHUB_OUTPUT" \
            || echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Translate with AI
        if: steps.check.outputs.skip != 'true'
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/translate.py --concurrency ${{ inputs.concurrency || '1' }} --batch ${{ inputs.batch || '30' }} --limit ${{ inputs.limit || '0' }} ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Translate READMEs (licensed only)
        if: steps.check.outputs.skip != 'true'
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/readmes.py --concurrency ${{ inputs.concurrency || '4' }} --limit ${{ inputs.readme_limit || '0' }}

      - name: Build artifacts
        if: steps.check.outputs.skip != 'true'
        run: python scripts/build.py

      - name: Commit translation cache back to main
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "ow-mod-db bot"
          git config user.email "ow-mod-db-bot@users.noreply.github.com"
          git add source/translations.json source/pending.json source/official.json \
            source/readmes.json source/license_cache.json source/readme_denylist.json
          git diff --cached --quiet || git commit -m "chore: 更新翻译缓存 [skip ci]"
          git push

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
